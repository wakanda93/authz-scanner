target:
  name: hardened
  base_url: http://127.0.0.1:8002

auth:
  login_path: /auth/login
  token_field: access_token

profile:
  path: /users/me
  id_field: id

identities:
  userA:
    email: userA@example.com
    password: Password123!
    role: user
  userB:
    email: userB@example.com
    password: Password123!
    role: user
  admin1:
    email: admin1@example.com
    password: Password123!
    role: admin

bola:
  tests:
    - name: regular_users_cannot_read_each_others_orders
      role: user
      owner_field: owner_id
      resource:
        list_method: GET
        list_path: /orders
        id_field: id
      attack:
        method: GET
        path_template: /orders/{id}
      expected_status: 403
    - name: regular_users_cannot_update_each_others_orders
      role: user
      owner_field: owner_id
      resource:
        list_method: GET
        list_path: /orders
        id_field: id
      attack:
        method: PUT
        path_template: /orders/{id}
        json_body:
          total_amount: "1.00"
      expected_status: 403
    - name: regular_users_cannot_cancel_each_others_orders
      role: user
      owner_field: owner_id
      resource:
        list_method: GET
        list_path: /orders
        id_field: id
      attack:
        method: DELETE
        path_template: /orders/{id}
      expected_status: 403
    - name: regular_users_cannot_list_each_others_order_items
      role: user
      owner_field: owner_id
      resource:
        list_method: GET
        list_path: /orders
        id_field: id
      attack:
        method: GET
        path_template: /orders/{id}/items
      expected_status: 403
    - name: regular_users_cannot_read_each_others_order_item_detail
      role: user
      owner_field: owner_id
      resource:
        list_method: GET
        list_path: /orders
        id_field: id
      attack:
        method: GET
        path_template: /orders/{id}/items/{item_id}
        path_params:
          item_id: items.0.id
      expected_status: 403

bfla:
  tests:
    - name: regular_users_cannot_refund_orders
      role: user
      resource:
        list_method: GET
        list_path: /orders
        id_field: id
        owner_field: owner_id
      attack:
        method: POST
        path_template: /orders/{id}/refund
      expected_status: 403
    - name: regular_users_cannot_approve_orders
      role: user
      resource:
        list_method: GET
        list_path: /orders
        id_field: id
        owner_field: owner_id
      attack:
        method: POST
        path_template: /orders/{id}/approve
      expected_status: 403
    - name: regular_users_cannot_list_admin_users
      role: user
      attack:
        method: GET
        path_template: /admin/users
      expected_status: 403
