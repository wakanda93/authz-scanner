target:
  name: external-api
  base_url: https://api.example.test

auth:
  login_path: /session
  token_field: token

profile:
  path: /me
  id_field: subject_id

identities:
  owner:
    email: owner@example.test
    password: owner-secret
    role: user
  attacker:
    email: attacker@example.test
    password: attacker-secret
    role: user
  admin:
    email: admin@example.test
    password: admin-secret
    role: admin

bola:
  tests:
    - name: users_cannot_read_each_others_resources
      role: user
      owner_field: owner_id
      resource:
        list_method: GET
        list_path: /resources
        id_field: id
      attack:
        method: GET
        path_template: /resources/{id}
      expected_status: 403

bfla:
  tests:
    - name: users_cannot_access_admin_functions
      role: user
      attack:
        method: GET
        path_template: /admin/users
      expected_status: 403

property_auth:
  tests:
    - name: profile_must_not_expose_sensitive_fields
      type: excessive_data_exposure
      role: user
      request:
        method: GET
        path_template: /me
      forbidden_fields:
        - password
        - password_hash
        - token
        - api_key
        - secret
    - name: create_resource_must_not_accept_server_controlled_fields
      type: mass_assignment
      role: user
      request:
        method: POST
        path_template: /resources
      payloads:
        - name: force_approved_state
          json_body:
            state: approved
          forbidden_effects:
            state: approved
